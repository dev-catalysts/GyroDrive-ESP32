<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="420" fill="#0d1117"/>
  <text x="380" y="38" fill="#e6edf3" font-size="22" text-anchor="middle" font-weight="bold">TiltDrive Wiring Diagram</text>
  <text x="380" y="60" fill="#8b949e" font-size="13" text-anchor="middle">ESP32-C3 SuperMini  +  MPU6050 (I2C)</text>

  <!-- ESP32 -->
  <rect x="60" y="90" width="200" height="270" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="160" y="120" fill="#58a6ff" font-size="16" text-anchor="middle" font-weight="bold">ESP32-C3</text>
  <text x="160" y="140" fill="#58a6ff" font-size="14" text-anchor="middle">SuperMini</text>
  <rect x="125" y="320" width="70" height="30" rx="4" fill="#30363d"/>
  <text x="160" y="340" fill="#e6edf3" font-size="12" text-anchor="middle">USB-C</text>

  <!-- MPU -->
  <rect x="500" y="90" width="200" height="270" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="600" y="120" fill="#3fb950" font-size="16" text-anchor="middle" font-weight="bold">MPU6050</text>
  <text x="600" y="140" fill="#3fb950" font-size="14" text-anchor="middle">GY-521 module</text>

  <!-- pins ESP -->
  <circle cx="260" cy="180" r="6" fill="#f85149"/><text x="245" y="184" fill="#e6edf3" font-size="13" text-anchor="end">3V3</text>
  <circle cx="260" cy="225" r="6" fill="#6e7681"/><text x="245" y="229" fill="#e6edf3" font-size="13" text-anchor="end">GND</text>
  <circle cx="260" cy="270" r="6" fill="#58a6ff"/><text x="245" y="274" fill="#e6edf3" font-size="13" text-anchor="end">GPIO8</text>
  <circle cx="260" cy="315" r="6" fill="#d29922"/><text x="245" y="319" fill="#e6edf3" font-size="13" text-anchor="end">GPIO9</text>

  <!-- pins MPU -->
  <circle cx="500" cy="180" r="6" fill="#f85149"/><text x="515" y="184" fill="#e6edf3" font-size="13">VCC</text>
  <circle cx="500" cy="225" r="6" fill="#6e7681"/><text x="515" y="229" fill="#e6edf3" font-size="13">GND</text>
  <circle cx="500" cy="270" r="6" fill="#58a6ff"/><text x="515" y="274" fill="#e6edf3" font-size="13">SDA</text>
  <circle cx="500" cy="315" r="6" fill="#d29922"/><text x="515" y="319" fill="#e6edf3" font-size="13">SCL</text>

  <!-- wires -->
  <path d="M266 180 H500" stroke="#f85149" stroke-width="4" fill="none"/>
  <path d="M266 225 H500" stroke="#8b949e" stroke-width="4" fill="none"/>
  <path d="M266 270 H500" stroke="#58a6ff" stroke-width="4" fill="none"/>
  <path d="M266 315 H500" stroke="#d29922" stroke-width="4" fill="none"/>

  <text x="380" y="172" fill="#f85149" font-size="12" text-anchor="middle">3.3V power (NOT 5V)</text>
  <text x="380" y="217" fill="#8b949e" font-size="12" text-anchor="middle">Ground</text>
  <text x="380" y="262" fill="#58a6ff" font-size="12" text-anchor="middle">I2C data</text>
  <text x="380" y="307" fill="#d29922" font-size="12" text-anchor="middle">I2C clock</text>

  <text x="380" y="395" fill="#8b949e" font-size="12" text-anchor="middle">Mount the MPU6050 flat on the back of your hand. Leave AD0 unconnected (address 0x68).</text>
</svg>
